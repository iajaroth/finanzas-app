name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Compilar cliente web
        working-directory: client
        env:
          VITE_API_BASE: https://financiera.jbsautomation.online
        run: |
          npm ci
          npm run build

      - name: Preparar proyecto Android (Capacitor)
        run: |
          npm install --no-audit --no-fund
          npx cap add android || npx cap sync android
          npx cap sync android
          npx --yes @capacitor/assets generate --android --iconBackgroundColor "#0b0c0b" --splashBackgroundColor "#0b0c0b" --assetPath "assets"
      - name: Compilar APK debug
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon


      - name: Publicar APK en Releases (descarga publica)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Finanzas ultima version
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: finanzas-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
